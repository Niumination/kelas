name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verifikasi:
    name: Typecheck · Uji · Migrasi · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Periksa tipe
        run: npm run typecheck

      - name: Uji unit (generator PDF)
        run: npm run uji

      - name: Uji migrasi database (PGlite)
        run: npm run db:uji

      - name: Bangun aplikasi
        run: npm run build
        env:
          # Build harus berhasil tanpa kredensial apa pun (mode demo)
          NEXT_TELEMETRY_DISABLED: '1'
